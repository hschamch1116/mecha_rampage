<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Mecha Reverse-Joint Tyranno Walk</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d12;overflow:hidden;font-family:monospace;}
  canvas{display:block;}
  #ui{
    position:fixed;top:12px;left:12px;color:#9fd8ff;font-size:12px;
    background:rgba(10,15,20,0.6);padding:10px 14px;border-radius:6px;
    border:1px solid #2a3d4a;
  }
  #ui label{display:block;margin:6px 0 2px;}
  #ui input[type=range]{width:180px;}
</style>
</head>
<body>
<div id="ui">
  <label>보행 속도 <span id="v_speed">1.0</span></label>
  <input type="range" id="speed" min="0.2" max="3" step="0.05" value="1.0">
  <label>보폭 <span id="v_stride">1.0</span></label>
  <input type="range" id="stride" min="0.3" max="2" step="0.05" value="1.0">
  <label>몸통 전방 기울임 <span id="v_lean">1.0</span></label>
  <input type="range" id="lean" min="0" max="2" step="0.05" value="1.0">
  <label>중량감(묵직함) <span id="v_weight">1.0</span></label>
  <input type="range" id="weight" min="0.2" max="2" step="0.05" value="1.0">
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ---------- 기본 씬 셋업 ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0d12);
scene.fog = new THREE.Fog(0x0a0d12, 20, 70);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(9, 5, 12);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.2, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0x8fbfff, 0x101418, 0.9));
const key = new THREE.DirectionalLight(0xffe9c7, 1.4);
key.position.set(6, 12, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-15; key.shadow.camera.right=15;
key.shadow.camera.top=15; key.shadow.camera.bottom=-15;
scene.add(key);
const rim = new THREE.DirectionalLight(0x3fa0ff, 0.6);
rim.position.set(-8, 5, -6);
scene.add(rim);

// 바닥 (그리드 + 패널)
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(200,200),
  new THREE.MeshStandardMaterial({ color:0x11161c, roughness:0.9, metalness:0.1 })
);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);
const grid = new THREE.GridHelper(200, 100, 0x1c4a66, 0x111a22);
grid.position.y = 0.01;
scene.add(grid);

// ---------- 메카닉 머티리얼 ----------
const armor = new THREE.MeshStandardMaterial({ color:0x394856, metalness:0.85, roughness:0.35 });
const armorDark = new THREE.MeshStandardMaterial({ color:0x1c242c, metalness:0.7, roughness:0.5 });
const jointMat = new THREE.MeshStandardMaterial({ color:0xffb43d, metalness:0.6, roughness:0.4, emissive:0x552200, emissiveIntensity:0.3 });
const cockpitMat = new THREE.MeshStandardMaterial({ color:0x2fd7ff, emissive:0x0a5566, emissiveIntensity:1.2, metalness:0.2, roughness:0.2 });

function box(w,h,d,mat){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.castShadow=true; m.receiveShadow=true; return m; }
function cyl(r1,r2,h,mat,seg=10){ const m = new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg), mat); m.castShadow=true; return m; }

// ---------- 다리 생성 (역관절: 무릎이 뒤로 꺾임) ----------
// 계층: hipPivot -> thigh -> kneePivot -> shin -> anklePivot -> foot
const THIGH_LEN = 2.0;
const SHIN_LEN  = 2.2;
const FOOT_LEN  = 1.3;

function buildLeg(side){ // side: 1(right) / -1(left)
  const hipPivot = new THREE.Group();

  const thigh = box(0.55, THIGH_LEN, 0.55, armor);
  thigh.position.y = -THIGH_LEN/2;
  const thighJoint = cyl(0.35,0.35,0.7, jointMat);
  thighJoint.rotation.z = Math.PI/2;
  hipPivot.add(thighJoint);
  hipPivot.add(thigh);

  // 무릎: thigh 하단 끝에 위치, 뒤로(-z 방향으로) 꺾이는 역관절
  const kneePivot = new THREE.Group();
  kneePivot.position.y = -THIGH_LEN;
  thigh.add(kneePivot); // thigh 로컬좌표 기준, thigh.position이 이미 -THIGH_LEN/2 이므로 상대위치 재보정
  kneePivot.position.set(0, -THIGH_LEN/2, 0);

  const kneeJoint = cyl(0.3,0.3,0.6, jointMat);
  kneeJoint.rotation.z = Math.PI/2;
  kneePivot.add(kneeJoint);

  const shin = box(0.42, SHIN_LEN, 0.42, armorDark);
  shin.position.y = -SHIN_LEN/2;
  kneePivot.add(shin);

  // 발목
  const anklePivot = new THREE.Group();
  anklePivot.position.set(0, -SHIN_LEN, 0);
  shin.add(anklePivot);
  anklePivot.position.set(0, -SHIN_LEN/2, 0);

  const ankleJoint = cyl(0.22,0.22,0.5, jointMat);
  ankleJoint.rotation.z = Math.PI/2;
  anklePivot.add(ankleJoint);

  // 발 (발가락이 앞으로, 뒤꿈치가 살짝 뒤로 - 맹금류/티라노 발 느낌)
  const foot = new THREE.Group();
  const footTop = box(0.5, 0.28, FOOT_LEN, armor);
  footTop.position.set(0, -0.14, FOOT_LEN*0.25);
  const heel = box(0.5, 0.22, 0.5, armorDark);
  heel.position.set(0, -0.11, -0.45);
  const claw = cyl(0.08,0.02,0.5, armorDark, 6);
  claw.rotation.x = Math.PI/2 * 0.9;
  claw.position.set(0, -0.2, FOOT_LEN*0.75);
  foot.add(footTop, heel, claw);
  anklePivot.add(foot);

  return { hipPivot, kneePivot, anklePivot, foot };
}

const legR = buildLeg(1);
const legL = buildLeg(-1);

// ---------- 몸통 / 상체 ----------
const bodyRoot = new THREE.Group(); // 전체 무게중심 피벗 (바운스/틸트용)
scene.add(bodyRoot);

const hipWidth = 1.3;
legR.hipPivot.position.set(-hipWidth/2, 0, 0);
legL.hipPivot.position.set( hipWidth/2, 0, 0);

const pelvis = box(hipWidth+0.6, 0.7, 1.0, armorDark);
const torso = box(1.6, 1.7, 1.3, armor);
torso.position.y = 1.15;
const chestVent = box(0.9, 0.5, 0.15, armorDark);
chestVent.position.set(0, 1.3, 0.68);
const cockpit = box(0.6, 0.45, 0.5, cockpitMat);
cockpit.position.set(0, 1.9, 0.55);

const head = box(0.7, 0.5, 0.9, armor);
head.position.set(0, 2.6, 0.2);
const eye = box(0.15,0.12,0.05, cockpitMat);
eye.position.set(0.2, 2.6, 0.66);
const eye2 = eye.clone(); eye2.position.x = -0.2;

// 어깨/팔 (간단히 - 걷기 반동에 맞춰 살짝 스윙)
function buildArm(side){
  const shoulderPivot = new THREE.Group();
  const upperArm = box(0.4,1.1,0.4, armor);
  upperArm.position.y = -0.55;
  const foreArm = box(0.32,1.0,0.32, armorDark);
  foreArm.position.y = -1.15;
  shoulderPivot.add(upperArm, foreArm);
  shoulderPivot.position.set(side*1.15, 1.75, 0);
  return shoulderPivot;
}
const armR = buildArm(1);
const armL = buildArm(-1);

// 꼬리 (티라노 밸런스 - 반대 위상으로 흔들림)
const tailSegs = [];
let tailParent = bodyRoot;
const TAIL_COUNT = 5;
for(let i=0;i<TAIL_COUNT;i++){
  const seg = new THREE.Group();
  const len = 0.9 - i*0.08;
  const mesh = box(0.5 - i*0.06, 0.5 - i*0.06, len, i%2? armorDark:armor);
  mesh.position.z = -len/2;
  seg.add(mesh);
  seg.position.z = i===0 ? -0.55 : -(0.9 - (i-1)*0.08);
  tailParent.add(seg);
  tailParent = seg;
  tailSegs.push(seg);
}
tailSegs[0].parent.remove(tailSegs[0]);
// 꼬리 루트를 pelvis 뒤쪽에 붙임
const tailRoot = new THREE.Group();
tailRoot.position.set(0, 1.0, -0.5);
tailRoot.add(tailSegs[0]);
bodyRoot.add(tailRoot);

bodyRoot.add(pelvis, torso, chestVent, cockpit, head, eye, eye2, armR, armL, legR.hipPivot, legL.hipPivot);
bodyRoot.position.y = THIGH_LEN + SHIN_LEN; // 다리 위에 몸통을 올림 (다리는 아래로 뻗어있으므로)

// ---------- 절차적 워크 사이클 ----------
const clock = new THREE.Clock();
const params = { speed:1.0, stride:1.0, lean:1.0, weight:1.0 };

['speed','stride','lean','weight'].forEach(k=>{
  const el = document.getElementById(k);
  const label = document.getElementById('v_'+k);
  el.addEventListener('input', ()=>{ params[k]=parseFloat(el.value); label.textContent=el.value; });
});

function clamp01(x){ return Math.max(0, Math.min(1,x)); }

function animateLeg(leg, phase, weight, stride){
  // phase: 0~2PI 사이클
  const hipSwing = Math.sin(phase) * 0.5 * stride;          // 앞뒤 스윙
  const liftRaw = Math.max(0, Math.sin(phase));              // swing phase(발 드는 구간)만 양수
  const lift = Math.pow(liftRaw, 1.6);                        // 스텝 시작/착지 스냅감

  // 힙: 앞뒤로 회전
  leg.hipPivot.rotation.x = hipSwing;

  // 무릎(역관절): swing 시 확 접히고, stance 시 거의 펴짐 -> 무겁게 딛는 느낌
  const kneeBend = 0.35 + lift * (1.5) ; // 뒤로 꺾이므로 양의 회전이 "뒤로 접힘"
  leg.kneePivot.rotation.x = kneeBend;

  // 발목: 착지 순간 평평하게, 스윙 중엔 살짝 접힘(발끝 들림)
  leg.anklePivot.rotation.x = -kneeBend*0.6 + lift*0.4;

  // 다리 전체 살짝 들어올림 (스윙 시)
  leg.hipPivot.position.y = lift * 0.35 * weight;

  return lift;
}

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const speed = params.speed, stride = params.stride, weight = params.weight, lean = params.lean;

  const cyclePhase = t * speed * Math.PI * 1.6;

  // 좌우 다리는 위상 180도 차이 (2족 보행)
  const liftR = animateLeg(legR, cyclePhase, weight, stride);
  const liftL = animateLeg(legL, cyclePhase + Math.PI, weight, stride);

  // 몸통 상하 바운스: 착지 임팩트 시 더 가라앉는 느낌(중량감)
  const impact = Math.max(liftR, liftL);
  const bounce = -0.18 * weight * (1 - impact*0.6) * (0.5+0.5*Math.sin(cyclePhase*2));
  bodyRoot.position.y = THIGH_LEN + SHIN_LEN + bounce*0.3;

  // 몸통 전방 기울임 + 좌우 롤(무게 이동)
  torso.parent === bodyRoot;
  bodyRoot.rotation.z = Math.sin(cyclePhase) * 0.05 * weight; // 좌우 무게중심 이동
  bodyRoot.rotation.x = 0.18*lean + Math.sin(cyclePhase*2) * 0.03 * weight; // 전방 기울임 + 피치 흔들림

  // 팔은 반대 위상으로 살짝 스윙 (반동)
  armR.rotation.x = -Math.sin(cyclePhase) * 0.25;
  armL.rotation.x = -Math.sin(cyclePhase+Math.PI) * 0.25;

  // 꼬리: 다리와 반대 위상으로 좌우 카운터스윙 (밸런스)
  tailSegs.forEach((seg, i)=>{
    const damp = 1 - i*0.12;
    seg.rotation.y = Math.sin(cyclePhase + Math.PI + i*0.3) * 0.28 * damp;
    seg.rotation.x = Math.sin(cyclePhase*2 + i*0.3) * 0.05 * damp;
  });

  // 헤드 살짝 카운터 무브 (안정된 시선)
  head.rotation.x = -bodyRoot.rotation.x*0.6;
  head.rotation.z = -bodyRoot.rotation.z*0.6;

  // 전진 이동 (선택: 앞으로 걷게 하려면 아래 주석 해제)
  bodyRoot.position.z -= speed * stride * 0.02;
  if(bodyRoot.position.z < -40) bodyRoot.position.z = 5;
  camera.position.z = bodyRoot.position.z + 12;
  controls.target.z = bodyRoot.position.z;

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
